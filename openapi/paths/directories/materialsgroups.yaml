              type: array
              items:
                $ref: "../../components/schemas/directories/MaterialsGroup.yaml"
      '401':
        $ref: "../../components/responses/Unauthorized.yaml"
  post:
    tags: [MaterialsGroups]
    requestBody:
      required: true
