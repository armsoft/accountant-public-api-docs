        application/json:
          schema:
            $ref: "../../components/schemas/directories/MaterialsGroup.yaml"
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: "../../components/schemas/directories/MaterialsGroup.yaml"
      '401':
        $ref: "../../components/responses/Unauthorized.yaml"
