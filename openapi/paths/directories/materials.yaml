      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/directories/MaterialFilters.yaml"
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: "../../components/schemas/directories/MaterialRowApiResponse.yaml"
      '401':
        $ref: "../../components/responses/Unauthorized.yaml"
/directories/materials/list/nextpage:
  post:
    tags: [Materials]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/_shared/NextPageRequest.yaml"
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: "../../components/schemas/directories/MaterialRowApiResponse.yaml"
      '401':
        $ref: "../../components/responses/Unauthorized.yaml"
/directories/materials:
  post:
    tags: [Materials]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/directories/Material.yaml"
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: "../../components/schemas/directories/Material.yaml"
      '401':
        $ref: "../../components/responses/Unauthorized.yaml"
